# CI workflow for the 2.4.x line
#
# Triggers:
#   - push / pull_request on 2.4.x
#   - manual workflow_dispatch
#
# Runs `mvn -B clean verify` with version-line JDK.
name: CI

on:
  push:
    branches: [2.4.x]
  pull_request:
    branches: [2.4.x]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: JDK 8 Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: [8]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and verify
        run: mvn -B --no-transfer-progress clean verify

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: target/surefire-reports
          retention-days: 14
